<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Aplicación SPA-SUPERADMINS</title>

    <!--AJAX-->
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!--FontAwesome-->
    <script src="https://kit.fontawesome.com/bc29e07588.js" crossorigin="anonymous"></script>

    <!-- COGNITO -->
    <script src="./js/aws-sdk-2.487.0.min.js"></script>
    <script src="./js/aws-cognito-sdk.min.js"></script>
    <script src="./js/amazon-cognito-identity.min.js"></script>

    <!-- Mis Scripts -->
    <script src="./js/funcionesCargaSuperadmins.js"></script>
    <script src="./js/funcionesCognitoSuperadmins.js"></script>
    <script src="./js/funcionesSuperAdmin.js"></script>


    <style>

		.navbar {
		    width: 100%; 
		    display: flex; 
		    justify-content: center; 
		    background-color: #295E7E;
		}	
        #contenido-ajax {
            width: 60%; 
		    max-height: 87vh; 
		    height: auto; 
		    margin: 30px auto; 
		    background-color: white;
		    padding: 20px;
		    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
		    border-radius: 10px;
		    overflow: auto; 
		    display: flex;
		    flex-direction: column; 
		    justify-content: flex-start;      
        }
        #formulario-login {
            width: 80%; 
            padding: 20px; 
            margin-left: auto;
			margin-right: auto;
            display: flex; 
		    flex-direction: column; 
		    justify-content: center; 
		}



    </style>

</head>

<body style="background-color:#FCDA8A;">
	<!------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------->
	<nav class="navbar" style="background-color:#FFA600; display: flex; justify-content: space-between; align-items: center; padding: 0 10px; height: 50px">
		<!--Botones izquierda -->
	    <div style="flex: 1;">
	        <div class="btn-group">
	            <button type="button" class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" id="inbox_admin_id" style="display: none">
	                <span class="badge text-bg-secondary rounded-pill" id="count_mensajes_admin_id"></span><i class="bi bi-inbox-fill"></i>
	            </button>
	            <ul class="dropdown-menu" id="dropdownMenu_msg_id" style="position: absolute; z-index: 1000; width: 700px;">
	                <!-- Dropdown menu items here -->
	            </ul>
	        </div>
	    </div>
	    <!-- Título centrado -->
	    <div style="flex: 0 1 auto;">
	        <span class="navbar-brand mb-0 h1" style="color: ghostwhite;" id="titulo_app_id">MI APLICACIÓN-SUPERADMINS</span>
	    </div>

	    <!-- Botones derecha -->
	    <div style="flex: 1; display: flex; justify-content: flex-end;">
	        <button type="button" id="btn_signOut_id" class="btn btn-light" onclick="signOut()" style="display: none; margin-left: 5px;">Cerrar sesión</button>
	    </div>
	</nav>
<!------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------->

	<div id="contenido-ajax">
		<div id="formulario-login">
			<div>
		      <label for="username_id" style="font-weight: bold;">Usuario</label>
		      <input type="text" class="form-control" id="username_id" placeholder="Username">
		    </div>
		    <br>
		    <div>
		      <label for="pass_id" style="font-weight: bold;">Contraseña</label>
		      <input type="password" class="form-control" id="pass_id" placeholder="Password">
		    </div>
		    <br>
		    <button type="button" class="btn btn-secondary" onclick="signIn()">Iniciar sesión</button>
		    <br>
		    <div class="w-100">
		      <div class="alert alert-danger w-100 m-0"  role="alert" style="display: none;" id="error_login_alert_id">
		      </div>
	   		</div>
		</div>	   
	</div>

<!------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------->
<!------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------->
	<!-- Modal Registrar Admin Empresa-->
	<div class="modal fade" id="modal_RegAdminEmpresa_id" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
	  <div class="modal-dialog">
	    <div class="modal-content">
	      <div class="modal-header" style="background-color:#FFA600;">
	        <h1 class="modal-title fs-5" id="exampleModalLabel" style="color: ghostwhite;">Registrar Empresa administradora</h1>
	        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
	      </div>
	      <div class="modal-body" id="modal_RegAdminEmpresa_body_id">
	      </div>
	      <div class="modal-footer" style="background-color:#FFA600;">
			  <div>
			    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cerrar</button>
			    <button type="button" class="btn btn-light" onclick="regEmpresaAdmin()">Registrar</button>
			  </div>
			</div>
	    </div>
	  </div>
	</div>
<!------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------->
<!------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------->
	<!-- Modal Registrar SuperAdmin-->
	<div class="modal fade" id="modal_RegSuperAdmin_id" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
	  <div class="modal-dialog">
	    <div class="modal-content">
	      <div class="modal-header" style="background-color:#FFA600;">
	        <h1 class="modal-title fs-5" id="exampleModalLabel" style="color: ghostwhite;">Registrar SuperAdmin</h1>
	        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
	      </div>
	      <div class="modal-body" id="modal_RegSuperAdmin_body_id">
	      </div>
	      <div class="modal-footer" style="background-color:#FFA600;">
			  <div>
			    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cerrar</button>
			    <button type="button" class="btn btn-light" onclick="newSuperAdmin()">Registrar</button>
			  </div>
			</div>
	    </div>
	  </div>
	</div>
<!------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------->
<!------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------->
	<!-- Modal Asignar Admin-->
	<div class="modal fade" id="modal_assignAdmin_id" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
	  <div class="modal-dialog">
	    <div class="modal-content">
	      <div class="modal-header" style="background-color:#FFA600;">
	        <h1 class="modal-title fs-5" id="exampleModalLabel" style="color: ghostwhite;">Asignar Administrador</h1>
	        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
	      </div>
	      <div class="modal-body" id="modal_assignAdmin_body_id">
	      </div>
	      <div class="modal-footer" style="background-color:#FFA600;">
			  <div>
			    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cerrar</button>
			    <button type="button" class="btn btn-light" onclick="inviteAdmin()">Registrar</button>
			  </div>
			</div>
	    </div>
	  </div>
	</div>
<!------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------->
<!------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------->
	<!-- Modal Contact Empresa-->
	<div class="modal fade" id="modal_contactEmpresa_id" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
	  <div class="modal-dialog">
	    <div class="modal-content">
	      <div class="modal-header" style="background-color:#FFA600;">
	        <h1 class="modal-title fs-5" id="exampleModalLabel" style="color: ghostwhite;">Enviar mensaje</h1>
	        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
	      </div>
	      <div class="modal-body" id="modal_contactEmpresa_body_id">
	      </div>
	      <div class="modal-footer" style="background-color:#FFA600;">
			  <div>
			    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cerrar</button>
			    <button type="button" class="btn btn-light" onclick="contactarEmpresa()">Enviar</button>
			  </div>
			</div>
	    </div>
	  </div>
	</div>
<!------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------->
</body>
</html>

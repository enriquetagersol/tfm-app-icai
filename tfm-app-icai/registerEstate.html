<!--Formulario para registrar una finca-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Aplicación SPA</title>

    <!--AJAX-->
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- COGNITO -->
    <script src="./js/aws-sdk-2.487.0.min.js"></script>
    <script src="./js/aws-cognito-sdk.min.js"></script>
    <script src="./js/amazon-cognito-identity.min.js"></script>

    <!-- Mis Scripts -->
    <script src="./js/funcionesCarga.js"></script>
    <script src="./js/funcionesCognito.js"></script>
    <script src="./js/funcionesAdmin.js"></script>
</head>

<body>
  <br>
  <div class="form-group">
    <label for="name_id" style="font-weight: bold;">Nombre Finca</label>
    <input type="text" class="form-control" id="name_id" placeholder="Residencial...">
  </div>

  <br>

  <div class="form-group">
    <label for="address_id" style="font-weight: bold;">Dirección</label>
    <input type="text" class="form-control" id="address_id" placeholder="1234 Main St">
  </div>

  <br>

  <div class="form-group">
    <label for="city_id" style="font-weight: bold;">Población</label>
    <input type="text" class="form-control" id="city_id" placeholder="Población">
  </div>

  <br>

  <div class="form-group">
    <label for="region_id" style="font-weight: bold;">Región</label>
      <div class="row">
        <div class="col">
          <input type="text" class="form-control" id="region_id" placeholder="Región">
        </div>
        <div class="col">
          <input type="text" class="form-control" id="zip_id" placeholder="Código Postal">
        </div>
      </div>
  </div>

  <br>

  <div class="w-100">
    <div class="alert alert-danger w-100 m-0"  role="alert" style="display: none;" id="error_newEstate_alert_id">
    </div>
    <div class="alert alert-success w-100 m-0" role="alert" style="display: none;" id="newEstate_OK_alert_id">
    </div>
  </div>
  <br>          
</body>

</html>

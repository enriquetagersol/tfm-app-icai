<!--Formulario para crear encuesta-->

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Aplicación SPA</title>

    <!--AJAX-->
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- COGNITO -->
    <script src="./js/aws-sdk-2.487.0.min.js"></script>
    <script src="./js/aws-cognito-sdk.min.js"></script>
    <script src="./js/amazon-cognito-identity.min.js"></script>

    <!-- Mis Scripts -->
    <script src="./js/funcionesCarga.js"></script>
    <script src="./js/funcionesCognito.js"></script>
    <script src="./js/funcionesAdmin.js"></script>
    <script src="./js/funcionesUser.js"></script>

    </head>

<body>
   <br>

   <div class="form-group">
      <label style="font-weight: bold;">Motivo de la encuesta</label>
      <input type="text" class="form-control" id="motivo_encuesta_id">
   </div>

   <br>

   <div class="form-group">
      <label style="font-weight: bold;">Descripción</label>
      <textarea class="form-control" id="descripcion_encuesta_id" rows="3"></textarea>
   </div> 

   <br>
   
   <div class="w-100">
      <div class="alert alert-danger w-100 m-0"  role="alert" style="display: none;" id="error_encuesta_alert_id">
      </div>
      <div class="alert alert-success w-100 m-0" role="alert" style="display: none;" id="encuesta_OK_alert_id">
      </div>
   </div>

   <br>

</body>

</html>

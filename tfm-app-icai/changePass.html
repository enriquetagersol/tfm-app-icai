<!--Formulario para el cambio de la contraseña temporal-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambio de contraseña</title>

    <!--AJAX-->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- COGNITO -->
    <script src="./js/aws-sdk-2.487.0.min.js"></script>
    <script src="./js/aws-cognito-sdk.min.js"></script>
    <script src="./js/amazon-cognito-identity.min.js"></script>

    <!-- Mis Scripts -->
    <script src="./js/funcionesCarga.js"></script>
    <script src="./js/funcionesCognito.js"></script>

    <style>
        .navbar {
            width: 100%; 
            display: flex; 
            justify-content: center; 
            background-color: #295E7E;
        }   
        #contenido_id {
            width: 60%; 
            max-height: 87vh; 
            height: auto; 
            margin: 30px auto; 
            background-color: white;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 10px;
            overflow: auto; 
            display: flex;
            flex-direction: column; 
            justify-content: flex-start;      
        }
        #formulario-changePass {
            width: 80%; 
            padding: 20px; 
            margin-left: auto;
            margin-right: auto;
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
        }
    </style>
</head>
<body style="background-color:#AEBAC2;">

    <nav class="navbar" style="background-color:#295E7E;">
        <div class="container-fluid d-flex justify-content-between">

            <!-- Título centrado -->
            <div class="mx-auto">
                <span class="navbar-brand mb-0 h1" style="color: ghostwhite;">MI APLICACIÓN</span>
            </div>

        </div>
    </nav>
    <br>
    <div id="contenido_id">
        <div id="formulario-changePass">
            <div>
                <label for="userLogin" style="font-weight: bold;">Usuario</label>
                <input type="text" class="form-control" id="user_login_id" placeholder="Username" required>
            </div>
            <br>
            <div>
                <label for="temp_pass_id" style="font-weight: bold;">Contraseña temporal</label>
                <input type="password" class="form-control"  id="temp_pass_id" placeholder="Password" required>
            </div>
            <br>
            <div>
                <label for="new_pass_id" style="font-weight: bold;">Nueva contraseña</label>
                <input type="password" class="form-control"  id="new_pass_id" placeholder="New password" required>
            </div>
            <br>
            <div>
                <button type="button" class="btn btn-secondary" onclick="changeTempPass()">Actualizar contraseña</button>
            </div>
        </div>
    </div>

</body>
</html>

<!--Formulario para confirmar asistencia-->

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Aplicación</title>

    <!--AJAX-->
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!--FontAwesome-->
    <script src="https://kit.fontawesome.com/bc29e07588.js" crossorigin="anonymous"></script>

    <!-- COGNITO -->
    <script src="./js/aws-sdk-2.487.0.min.js"></script>
    <script src="./js/aws-cognito-sdk.min.js"></script>
    <script src="./js/amazon-cognito-identity.min.js"></script>

    <!-- Mis Scripts -->
    <script src="./js/funcionesCarga.js"></script>
    <script src="./js/funcionesCognito.js"></script>
    <script src="./js/funcionesAdmin.js"></script>
    <script src="./js/funcionesUser.js"></script>


    <style>

        #formulario {
            width: 80%; 
            padding: 20px; 
            margin-left: auto;
			margin-right: auto;
            display: flex; 
		    flex-direction: column; 
		    justify-content: center; 
		}
		#contenido {
            width: 60%; 
		    max-height: 87vh; 
		    height: auto; 
		    margin: 30px auto; 
		    background-color: white;
		    padding: 20px;
		    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
		    border-radius: 10px;
		    overflow: auto; 
		    display: flex;
		    flex-direction: column; 
		    justify-content: flex-start;      
        }
        .btn-select {
            width: 100%;
        }
        .btn-select.selected {
            box-shadow: 0 0 0 5px black;
        }

    </style>


</head>

<body style="background-color:#AEBAC2;">
	<div class="container mt-5" id="contenido">
    <div id="formulario">
        <div class="form-group">
            <div class="row">
                <div class="col-6">
                    <button type="button" class="btn btn-success btn-select" id="votoSiButton" onclick="selectOption('Confirmada', this)">Confirmar</button>
                </div>
                <div class="col-6">
                    <button type="button" class="btn btn-danger btn-select" id="votoNoButton" onclick="selectOption('Declinada', this)">Declinar</button>
                </div>
            </div>
        </div>
        <br>
        <label style="font-weight: bold;">Comentarios</label>
        <textarea class="form-control" id="comentarios_asistencia_id" rows="3"></textarea>
    </div>
    <br>
    <button type="button" class="btn btn-secondary" onclick="sendResponse_evt()">Enviar confirmación de asistencia</button>
    <br>
    <div class="w-100">	      
		<div class="alert alert-danger w-100 m-0"  role="alert" style="display: none;" id="error_asistencia_alert_id">
		</div>
	</div>
	<br>
</div>

</body>
</html>

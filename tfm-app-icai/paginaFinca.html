<!--Página para cargar la información de una finca concreta-->

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Aplicación SPA</title>

    <!--AJAX-->
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!--FontAwesome-->
    <script src="https://kit.fontawesome.com/bc29e07588.js" crossorigin="anonymous"></script>

    <!-- COGNITO -->
    <script src="./js/aws-sdk-2.487.0.min.js"></script>
    <script src="./js/aws-cognito-sdk.min.js"></script>
    <script src="./js/amazon-cognito-identity.min.js"></script>

    <!-- Mis Scripts -->
    <script src="./js/funcionesCarga.js"></script>
    <script src="./js/funcionesCognito.js"></script>
    <script src="./js/funcionesAdmin.js"></script>
</head>

<body>
    <h1 id="titulo_finca_id">Titulo Finca</h1>

    <div class="row mt-3">
        <div class="col-6">
            <button class="btn btn-outline-secondary w-100" type="button" data-bs-toggle="collapse" data-bs-target="#div_listaEventos_id">Próximos Eventos
                <span class="badge text-bg-secondary rounded-pill" id="count_eventos_id"></span>
            </button>
            <div id="div_listaEventos_id" class="collapse overflow-auto" style="max-height: 500px;">
            </div>
        </div>
        <div class="col-6">
            <button class="btn btn-outline-secondary w-100" type="button" data-bs-toggle="collapse" data-bs-target="#div_listaEncuestas_id">Encuestas Activas
                <span class="badge text-bg-secondary rounded-pill" id="count_encuestas_id"></span>
            </button>
            <div id="div_listaEncuestas_id" class="collapse overflow-auto" style="max-height: 500px;">
            </div>
        </div>
    </div>

    <button class="btn btn-outline-secondary mt-3 w-100" type="button" data-bs-toggle="collapse" data-bs-target="#info_general_collapse_id">Información General</button>

    <div id="info_general_collapse_id" class="collapse">
        <div class="card-body" style="margin-top: 30px">
            <p><strong>Dirección:</strong> <span id="dir_finca_id"></span></p>
            <p><strong>Región:</strong> <span id="reg_finca_id"></span></p>
            <p><strong>Código Postal:</strong> <span id="cp_finca_id"></span></p>
        </div>
    </div>

    <button class="btn btn-outline-secondary mt-3 w-100" type="button" data-bs-toggle="collapse" data-bs-target="#docs_collapse_id">Documentos</button>

    <div id="docs_collapse_id" class="collapse">
        <div class="card-body">
            <div id="div_listaDocs_id" class="overflow-auto" style="max-height: 500px;"></div>
        </div>
    </div>

    <br><br>

    <h3>Propiedades</h3>

    <br>

    <div class="d-flex justify-content-between align-items-center">
      <div>
        <button type="button" class="btn btn-secondary" onclick="upload()">Subir archivo <i class="bi bi-filetype-csv"></i></button>
        <button type="button" class="btn btn-secondary" onclick="cargarFormularioPropiedad()"><i class="bi bi-house-add"></i></button><br><br>
      </div>
      <div >
          <a class="align-self-center" href="https://tfm-app-icai.s3.eu-west-3.amazonaws.com/plantillas/plantillaProperties.csv" download="properties_template.csv">Descargar plantilla <i class="bi bi-cloud-arrow-down"></i></a>
      </div>
    </div>

    <input type="file" id="fileInputcsv" style="display:none;" accept=".csv" />
    
    <div class="overflow-auto" style="max-height: 500px;">
        <div class="accordion" id="div_listaProp_id" style="max-height: 500px;">
    </div>

</body>

</html>
